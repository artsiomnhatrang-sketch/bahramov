<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Шаблон ролика 1080×1920 в стиле bahramovai.com. render.mjs кладёт данные в window.VIDEO
     и для каждого кадра зовёт seek(t): всё на экране — функция от времени, живых анимаций нет.
     Картинки сцен (vis) рисуются здесь же в HTML/SVG: макеты экранов без чужих логотипов,
     крупные цифры, списки, графики, схемы. -->
<style>
@font-face { font-family: Unbounded; src: url(../fonts/Unbounded.ttf); font-weight: 200 900; }
@font-face { font-family: Inter; src: url(../fonts/Inter.ttf); font-weight: 100 900; }
:root {
  --bg: #000; --bg3: #0a0a0a; --bg4: #141414; --orange: #f4672a;
  --orange-dim: rgba(244,103,42,0.12); --orange-border: rgba(244,103,42,0.35);
  --text: #e8e8e8; --muted: #a3a3a3; --dim: #5c5c5c; --border: rgba(255,255,255,0.09);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; background: var(--bg); overflow: hidden; }
body { font-family: Inter, sans-serif; color: var(--text); position: relative; }

/* Безопасная зона Reels/Shorts: сверху ~220px, снизу ~420px (до y=1500), справа ~120px.
   Всё важное — в полосе x 120…960, y 330…1530, композиция по центру кадра (02.10: была прижата вверх). */
.label { position: absolute; top: 330px; left: 120px; right: 120px; text-align: center; }
.label span { display: inline-block; font: 600 28px/1 Unbounded; letter-spacing: 3px; text-transform: uppercase;
  color: var(--orange); background: var(--orange-dim); border: 1.5px solid var(--orange-border);
  border-radius: 100px; padding: 15px 30px; }

.scene { position: absolute; inset: 0; display: none; }
.head { position: absolute; top: 406px; left: 120px; right: 120px; text-align: center;
  font: 800 74px/1.12 Unbounded; text-transform: uppercase; letter-spacing: -1px; }
.head .w { display: inline-block; margin: 0 9px; }
.head.small { font-size: 60px; }
.vis { position: absolute; left: 120px; right: 120px; top: 640px; height: 630px; }

/* общие детали */
.card { background: var(--bg3); border: 1.5px solid var(--border); border-radius: 16px; }
.pill { display: inline-block; border-radius: 100px; padding: 14px 28px; font: 700 30px/1 Unbounded; }
.pill.o { background: var(--orange); color: #000; }
.pill.g { background: var(--bg4); color: var(--muted); border: 1.5px solid var(--border); }

/* big: крупная цифра или слово */
.big { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.big .n { font: 800 230px/1 Unbounded; color: var(--orange); letter-spacing: -6px; position: relative; white-space: nowrap; }
.big .n.l { font-size: 170px; letter-spacing: -4px; }
.big .n.xl { font-size: 120px; letter-spacing: -3px; }
.big .n .x { position: absolute; left: -4%; right: -4%; top: 50%; height: 16px; background: var(--text); border-radius: 8px; transform-origin: left center; }
.big .c { margin-top: 40px; font: 500 46px/1.3 Inter; color: var(--text); max-width: 820px; }

/* phone: обобщённый экран соцсети с плашкой */
.phone { position: absolute; left: 50%; top: 0; width: 440px; height: 630px; margin-left: -220px;
  border-radius: 56px; border: 3px solid #2a2a2a; background: var(--bg3); overflow: hidden; }
.phone .bar { position: absolute; top: 34px; left: 50%; width: 120px; height: 30px; margin-left: -60px; background: #000; border-radius: 100px; }
.phone .prof { position: absolute; top: 96px; left: 36px; right: 36px; display: flex; gap: 22px; align-items: center; }
.phone .ava { width: 104px; height: 104px; border-radius: 100px; background: #222; flex: none; }
.phone .ln { height: 18px; background: #222; border-radius: 9px; margin: 12px 0; }
.phone .grid { position: absolute; top: 250px; left: 36px; right: 36px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.phone .grid i { display: block; aspect-ratio: 1; background: #1c1c1c; border-radius: 6px; }
.phone .dim { position: absolute; inset: 0; background: rgba(0,0,0,0.72); }
.phone .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #111; border-top: 1.5px solid var(--border);
  border-radius: 32px 32px 0 0; padding: 40px 36px 50px; text-align: center; }
.phone .sheet .ic { width: 88px; height: 88px; margin: 0 auto 22px; border-radius: 100px; border: 4px solid var(--orange);
  color: var(--orange); font: 800 52px/80px Unbounded; }
.phone .sheet .t { font: 700 36px/1.2 Unbounded; margin-bottom: 14px; }
.phone .sheet .d { font: 400 26px/1.35 Inter; color: var(--muted); margin-bottom: 28px; }
.phone .sheet .b { border: 1.5px solid #3a3a3a; border-radius: 100px; padding: 18px 0; font: 600 28px/1 Inter; }

/* list: строки по очереди, одна подсвечена */
.list { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
.row { display: flex; align-items: center; gap: 28px; padding: 30px 34px; border-radius: 16px; background: var(--bg3);
  border: 2px solid var(--border); }
.row .k { flex: none; width: 76px; height: 76px; border-radius: 100px; background: var(--bg4); color: var(--muted);
  font: 800 38px/76px Unbounded; text-align: center; }
.row .tx { font: 600 40px/1.2 Inter; }
.row .tx small { display: block; font: 400 32px/1.3 Inter; color: var(--muted); margin-top: 8px; }
.row.on { border-color: var(--orange); }
.row.on .k { background: var(--orange); color: #000; }
.row.off { opacity: 0.38; }

/* chart: столбики охватов */
.chart { position: absolute; inset: 0; }
.chart .ttl { font: 500 34px/1 Inter; color: var(--muted); margin: 10px 0 0 6px; }
.chart .plot { position: absolute; left: 0; right: 0; top: 80px; bottom: 90px; display: flex; align-items: flex-end; gap: 16px;
  border-bottom: 2px solid var(--border); padding: 0 6px; }
.chart .col { flex: 1; position: relative; height: 100%; display: flex; align-items: flex-end; }
.chart .col i { display: block; width: 100%; background: #3a3a3a; border-radius: 10px 10px 0 0; transform-origin: bottom; }
.chart .col.hi i { background: var(--orange); }
.chart .col b { position: absolute; left: 0; right: 0; bottom: -62px; text-align: center; font: 500 28px/1 Inter; color: var(--muted); }
.chart .note { position: absolute; right: 6px; top: 0; }

/* flow: схема автоматизации сверху вниз */
.flow { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.node { width: 640px; padding: 30px 36px; border-radius: 16px; background: var(--bg3); border: 2px solid var(--border);
  display: flex; align-items: center; gap: 26px; }
.node .ic { flex: none; width: 70px; height: 70px; border-radius: 100px; background: var(--bg4); font: 700 36px/70px Inter; text-align: center; }
.node .tx { font: 600 38px/1.2 Inter; }
.node.on { border-color: var(--orange); }
.arrow { width: 4px; height: 56px; background: var(--dim); position: relative; }
.arrow::after { content: ''; position: absolute; left: -12px; bottom: -4px; border: 14px solid transparent; border-top: 18px solid var(--dim); border-bottom: 0; }
.arrow.on { background: var(--orange); }
.arrow.on::after { border-top-color: var(--orange); }

/* compare: было / стало */
.cmp { position: absolute; inset: 0; display: flex; gap: 28px; align-items: center; }
.cmp .side { flex: 1; padding: 44px 32px; border-radius: 16px; background: var(--bg3); border: 2px solid var(--border); text-align: center; }
.cmp .side.on { border-color: var(--orange); }
.cmp .h { font: 700 32px/1 Unbounded; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
.cmp .v { font: 800 104px/1 Unbounded; margin: 34px 0 20px; letter-spacing: -3px; }
.cmp .side.on .v { color: var(--orange); }
.cmp .d { font: 400 32px/1.3 Inter; color: var(--muted); }

/* cta */
.btn { position: absolute; left: 120px; right: 120px; text-align: center; }
.btn span { display: inline-block; background: var(--orange); color: #000; font: 700 42px/1 Unbounded;
  padding: 34px 54px; border-radius: 100px; white-space: nowrap; }
/* step: шаг крупной цифрой + действие */
.step { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.step .k { width: 300px; height: 300px; border-radius: 50%; background: var(--orange); color: #000; font: 800 190px/300px Unbounded; }
.step .t { margin-top: 56px; font: 700 54px/1.18 Unbounded; max-width: 840px; }
.step .d { margin-top: 22px; font: 500 40px/1.3 Inter; color: var(--muted); }
.tg { position: absolute; left: 120px; right: 120px; text-align: center; font: 600 44px/1.2 Inter; color: var(--text); }

.sub { position: absolute; top: 1290px; height: 150px; left: 120px; right: 120px; text-align: center;
  display: flex; align-items: center; justify-content: center;  /* 1 и 2 строки — на одной оси, не прыгают */
  font: 700 52px/1.25 Inter; color: var(--text); }
.strip { position: absolute; top: 1462px; left: 120px; right: 120px; text-align: center;
  font: 500 29px/1.3 Inter; color: var(--muted); padding-top: 20px; border-top: 1.5px solid var(--border); }
.strip b { color: var(--text); font-weight: 600; }

/* ── монтаж v2 (04.10): живые фото/видео, всплывающие скриншоты, субтитры по слову ── */
/* фон сцены: та же картинка размыта и затемнена — кадр не бывает пустым чёрным */
.bgfill { position: absolute; inset: -80px; background-size: cover; background-position: center;
  filter: blur(42px) brightness(0.32) saturate(1.2); z-index: 0; opacity: 0; }
#scenes, .label, .sub, .strip { position: absolute; z-index: 2; }
#scenes { inset: 0; }
.vis.media-box { left: 56px; right: 56px; top: 606px; height: 680px; }
.media { position: absolute; inset: 0; border-radius: 30px; overflow: hidden; background: #111;
  box-shadow: 0 34px 90px rgba(0,0,0,0.7); border: 3px solid rgba(255,255,255,0.14); }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 40%; }
.media .tag { position: absolute; left: 22px; bottom: 22px; }
/* весь кадр (вертикальные исходники) */
.full { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
.full img { width: 100%; height: 100%; object-fit: cover; }
.full::after { content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.25) 32%, rgba(0,0,0,0.2) 58%, rgba(0,0,0,0.85) 78%, #000 100%); }
/* всплывающая вставка: скриншот, фото, плашка */
.pop { position: absolute; z-index: 5; border-radius: 22px; overflow: hidden; background: #fff;
  border: 6px solid #fff; box-shadow: 0 30px 80px rgba(0,0,0,0.75); }
.pop img { display: block; width: 100%; }
.popcap { position: absolute; z-index: 6; }
.popcap span { display: inline-block; background: var(--orange); color: #000; font: 700 28px/1 Inter;
  padding: 12px 22px; border-radius: 100px; white-space: nowrap; }
.joke { position: absolute; z-index: 6; left: 0; right: 0; text-align: center; }
.joke span { display: inline-block; font: 800 46px/1.1 Inter; color: #fff; padding: 14px 26px; border-radius: 14px;
  background: rgba(0,0,0,0.72); border: 2px solid rgba(255,255,255,0.18); }
/* субтитры по слову (как в референсе): одно слово крупно, обводка вместо фона */
.sub.word { font: 800 78px/1 Inter; letter-spacing: -1px; color: #fff;
  -webkit-text-stroke: 10px #000; paint-order: stroke fill; text-shadow: 0 6px 24px rgba(0,0,0,0.6); }
.sub.word .hl { color: var(--orange); }
/* 08.10: с кружком лица справа (--lico) субтитры уходят левее, чтобы длинные слова не заезжали под кружок */
.lico .sub { right: 360px; }
.head { text-shadow: 0 4px 30px rgba(0,0,0,0.8); }

/* ── монтаж v3 (09.10): камера, прогресс, вспышка, эмодзи, петля, таймер, штампы, путь по настройкам ── */
#cam { position: absolute; inset: 0; z-index: 1; transform-origin: 540px 945px; }
#prog { position: absolute; z-index: 8; top: 272px; left: 120px; right: 120px; height: 10px; border-radius: 5px;
  background: rgba(255,255,255,0.16); overflow: hidden; display: none; }
#prog i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--orange);
  box-shadow: 0 0 16px rgba(244,103,42,0.9); }
#flash { position: absolute; inset: 0; z-index: 9; background: #fff; opacity: 0; display: none; }
#emoji { position: absolute; z-index: 7; left: 596px; top: 1200px; width: 130px; text-align: center; opacity: 0;
  font: 96px/1 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.6)); }
#loophead { position: absolute; inset: 0; z-index: 3; display: none; }
.sub.word span { display: inline-block; white-space: nowrap; }
.sub.word .emo { margin-left: 16px; font-family: 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; font-size: 0.85em;
  -webkit-text-stroke: 0; text-shadow: none; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.6)); }
/* секундомер: кольцо убывает, цифры тикают */
.timer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.timer .dial { position: relative; width: 420px; height: 420px; }
.timer .knob { position: absolute; left: 50%; top: -30px; width: 76px; height: 30px; margin-left: -38px; background: #3a3a3a; border-radius: 12px 12px 0 0; }
.timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.timer .tr { fill: var(--bg3); stroke: rgba(255,255,255,0.12); stroke-width: 26; }
.timer .tf { fill: none; stroke: var(--orange); stroke-width: 26; stroke-linecap: round; }
.timer .td { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: 800 128px/1 Unbounded; letter-spacing: -4px; font-variant-numeric: tabular-nums; }
.timer .tc { margin-top: 40px; font: 700 54px/1.1 Unbounded; text-transform: uppercase; color: var(--orange); }
/* плашка-таймер поверх живой картинки */
.badge { position: absolute; z-index: 6; left: 90px; top: 580px; display: flex; align-items: center; gap: 18px;
  background: rgba(10,10,10,0.9); border: 3px solid #ff3b30; border-radius: 22px; padding: 18px 28px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
.badge .dot { width: 22px; height: 22px; border-radius: 50%; background: #ff3b30; flex: none; }
.badge .bd { font: 800 62px/1 Unbounded; color: #fff; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.badge .bc { font: 600 28px/1.15 Inter; color: #ff9b94; max-width: 170px; }
/* штамп: крестик или галочка */
.stamp { position: absolute; z-index: 6; }
.stamp svg, .checks .ic svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 12px 26px rgba(0,0,0,0.55)); }
/* checks: строки по очереди, у каждой штамп */
.checks { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
.checks .row { padding: 28px 30px; }
.checks .row .tx { flex: 1; }
.checks .ic { flex: none; width: 92px; height: 92px; }
.checks .row.bad { border-color: rgba(255,59,48,0.8); }
.checks .row.good { border-color: rgba(52,199,89,0.8); }
/* path: путь по настройкам - экраны сменяются, палец нажимает нужную строку */
.path .phone { overflow: hidden; }
.path .scr { position: absolute; inset: 0; background: var(--bg3); padding: 96px 30px 0; }
.path .st { font: 700 40px/1 Unbounded; margin: 0 6px 30px; }
.path .pr { position: relative; display: flex; align-items: center; gap: 20px; padding: 24px 20px; margin-bottom: 12px;
  border-radius: 16px; background: var(--bg4); border: 2px solid transparent; font: 600 30px/1.2 Inter; overflow: hidden; }
.path .pr i { flex: none; width: 46px; height: 46px; border-radius: 12px; background: #2a2a2a; }
.path .pr.on { border-color: var(--orange); background: rgba(244,103,42,0.16); }
.path .tap { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%;
  background: rgba(255,255,255,0.55); pointer-events: none; }
.path .crumb { position: absolute; left: 0; right: 0; top: -2px; text-align: center; }
</style>
</head>
<body>
<div class="bgfill" id="bgfill"></div>
<div class="label"><span id="label"></span></div>
<div id="scenes"></div>
<div class="sub" id="sub"></div>
<div class="strip" id="strip"></div>
<div id="loophead"></div><div id="emoji"></div><div id="prog"><i></i></div><div id="flash"></div>

<script>
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const nb = (s) => String(s).replace(/(^|\s)(\S{1,2})\s/g, '$1$2 '); // короткие слова не висят в конце строки
// v3: штампы ✕ / ✓ рисуем сами (SVG) - одинаково на любом компьютере, без чужих иконок
const SVG_X = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#ff3b30"/><path d="M33 33L67 67M67 33L33 67" stroke="#fff" stroke-width="11" stroke-linecap="round"/></svg>';
const SVG_OK = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#34c759"/><path d="M28 52L44 67L73 35" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const p2 = (n) => String(n).padStart(2, '0');
const fmtTime = (n, f) => f === 'hms' ? `${p2(Math.floor(n / 3600))}:${p2(Math.floor(n / 60) % 60)}:${p2(n % 60)}` : f === 'n' ? String(n) : `0:${p2(n)}`;
const backOut = (x) => { const c = 1.9; x = clamp(x) - 1; return 1 + (c + 1) * x * x * x + c * x * x; };

function headEl(text, small) {
  const h = el('div', 'head' + (small ? ' small' : ''));
  for (const w of nb(text).split(' ')) h.appendChild(el('span', 'w', w));
  return h;
}

// Каждая картинка: build(vis, box) → объект с anim(lt, s).
const VIS = {
  big(v, box) {
    const w = el('div', 'big');
    const len = String(v.n).length;
    const n = el('div', 'n' + (len > 7 ? ' xl' : len > 4 ? ' l' : ''), v.n);
    let x = null; if (v.strike) { x = el('i', 'x'); n.appendChild(x); }
    w.appendChild(n);
    const c = v.c ? el('div', 'c', nb(v.c)) : null; if (c) w.appendChild(c);
    box.appendChild(w);
    return { anim(lt) {
      const k = ease(lt / 0.35);
      n.style.transform = `scale(${0.6 + 0.4 * k})`; n.style.opacity = k;
      if (c) { const k2 = ease((lt - 0.35) / 0.3); c.style.opacity = k2; c.style.transform = `translateY(${(1 - k2) * 20}px)`; }
      if (x) x.style.transform = `rotate(-8deg) scaleX(${ease((lt - 0.6) / 0.25)})`;
    } };
  },

  phone(v, box) {
    const p = el('div', 'phone');
    p.innerHTML = `<div class="bar"></div>
      <div class="prof"><div class="ava"></div><div style="flex:1"><div class="ln" style="width:70%"></div><div class="ln" style="width:45%"></div></div></div>
      <div class="grid">${'<i></i>'.repeat(9)}</div>`;
    const dim = el('div', 'dim'); p.appendChild(dim);
    const sh = el('div', 'sheet', `<div class="ic">!</div><div class="t">${v.t ?? 'Аккаунт отключён'}</div>
      <div class="d">${v.d ?? 'Вы можете обжаловать это решение'}</div><div class="b">${v.b ?? 'Обжаловать'}</div>`);
    p.appendChild(sh); box.appendChild(p);
    return { anim(lt) {
      const k = ease(lt / 0.3);
      p.style.opacity = k; p.style.transform = `translateY(${(1 - k) * 80}px)`;
      const k2 = ease((lt - (v.at ?? 0.35)) / 0.3);
      dim.style.opacity = k2; sh.style.transform = `translateY(${(1 - k2) * 100}%)`;
      // лёгкая тряска плашки, когда она встала, — глазу есть за что зацепиться
      const sh2 = lt > 0.7 && lt < 1.0 ? Math.sin(lt * 70) * 6 : 0;
      p.style.transform += ` translateX(${sh2}px)`;
    } };
  },

  list(v, box) {
    const L = el('div', 'list');
    const rows = v.items.map((it, i) => {
      const r = el('div', 'row', `<div class="k">${it.k ?? i + 1}</div><div class="tx">${nb(it.t)}${it.d ? `<small>${nb(it.d)}</small>` : ''}</div>`);
      L.appendChild(r); return r;
    });
    box.appendChild(L);
    return { anim(lt) {
      rows.forEach((r, i) => {
        // appear: строки выезжают по очереди; hl: подсвеченная, остальные приглушены
        const k = v.appear ? ease((lt - i * (v.step ?? 0.45)) / 0.3) : 1;
        r.style.opacity = k; r.style.transform = `translateX(${(1 - k) * 60}px)`;
        r.classList.toggle('on', v.hl === i);
        r.classList.toggle('off', v.hl != null && v.hl !== i && k >= 1);
      });
    } };
  },

  chart(v, box) {
    const C = el('div', 'chart');
    C.appendChild(el('div', 'ttl', v.title ?? 'Охваты по неделям'));
    const plot = el('div', 'plot');
    const max = Math.max(...v.data);
    const cols = v.data.map((d, i) => {
      const c = el('div', 'col' + ((v.hi ?? []).includes(i) ? ' hi' : ''));
      const bar = el('i'); bar.style.height = `${(d / max) * 100}%`;
      c.append(bar, el('b', '', v.labels?.[i] ?? ''));
      plot.appendChild(c); return bar;
    });
    C.appendChild(plot);
    let note = null; if (v.note) { note = el('div', 'note', `<span class="pill o">${v.note}</span>`); C.appendChild(note); }
    box.appendChild(C);
    return { anim(lt) {
      cols.forEach((b, i) => { b.style.transform = `scaleY(${ease((lt - i * 0.08) / 0.35)})`; });
      if (note) { const k = ease((lt - 0.2 - cols.length * 0.08) / 0.3); note.style.opacity = k; note.style.transform = `scale(${0.7 + 0.3 * k})`; }
    } };
  },

  flow(v, box) {
    const F = el('div', 'flow');
    const parts = [];
    v.items.forEach((it, i) => {
      if (i) { const a = el('div', 'arrow'); F.appendChild(a); parts.push(a); }
      const n = el('div', 'node', `<div class="ic">${it.i ?? '•'}</div><div class="tx">${nb(it.t)}</div>`);
      F.appendChild(n); parts.push(n);
    });
    box.appendChild(F);
    return { anim(lt) {
      // узлы и стрелки загораются по очереди: как заявка бежит по схеме
      const per = v.step ?? 0.3;
      parts.forEach((p, i) => {
        const k = ease((lt - i * per) / 0.25);
        p.style.opacity = 0.15 + 0.85 * k;
        p.classList.toggle('on', lt >= i * per && (v.keep || lt < (i + 2) * per || i === parts.length - 1));
      });
    } };
  },

  compare(v, box) {
    const C = el('div', 'cmp');
    const a = el('div', 'side', `<div class="h">${v.a.h}</div><div class="v">${v.a.v}</div><div class="d">${nb(v.a.d ?? '')}</div>`);
    const b = el('div', 'side on', `<div class="h">${v.b.h}</div><div class="v">${v.b.v}</div><div class="d">${nb(v.b.d ?? '')}</div>`);
    C.append(a, b); box.appendChild(C);
    return { anim(lt) {
      const k1 = ease(lt / 0.3), k2 = ease((lt - (v.at ?? 0.6)) / 0.3);
      a.style.opacity = k1; a.style.transform = `translateY(${(1 - k1) * 50}px)`;
      b.style.opacity = k2; b.style.transform = `translateY(${(1 - k2) * 50}px) scale(${0.9 + 0.1 * k2})`;
    } };
  },

  step(v, box) {
    const w = el('div', 'step');
    const k = el('div', 'k', v.n), t = el('div', 't', nb(v.t)), d = v.d ? el('div', 'd', nb(v.d)) : null;
    w.append(k, t); if (d) w.appendChild(d); box.appendChild(w);
    return { anim(lt) {
      const a = ease(lt / 0.3), b = ease((lt - 0.3) / 0.3), c = ease((lt - 0.6) / 0.3);
      k.style.transform = `scale(${0.4 + 0.6 * a}) rotate(${(1 - a) * -30}deg)`; k.style.opacity = a;
      t.style.opacity = b; t.style.transform = `translateY(${(1 - b) * 30}px)`;
      if (d) d.style.opacity = c;
    } };
  },

  // photo / video: живая картинка крупной карточкой (горизонтальные исходники) или на весь кадр
  // (вертикальные, full: true). Видео — заранее нарезанные кадры (render.mjs), меняем src по времени.
  photo(v, box, s) { return VIS.video(v, box, s); },
  video(v, box, s) {
    const full = !!v.full;
    const wrap = full ? el('div', 'full') : el('div', 'media');
    const img = el('img'); wrap.appendChild(img);
    if (v.tag && !full) wrap.appendChild(el('div', 'tag', `<span class="pill o">${v.tag}</span>`));
    if (full) { s.node.insertBefore(wrap, s.node.firstChild); }
    else { box.classList.add('media-box'); box.appendChild(wrap); }
    // надпись поверх живой картинки (текст уведомления, шутка) — появляется через треть секунды
    let joke = null;
    if (v.joke) { joke = el('div', 'joke', `<span>${v.joke}</span>`); joke.style.top = full ? '700px' : '660px'; s.node.appendChild(joke); }
    const first = v.frames ? frameSrc(v, 0) : v.src;
    s.bg = first;
    img.src = first;
    const zoom = v.zoom ?? (v.frames ? 0.04 : 0.09);
    return { anim(lt, sc) {
      const p = clamp(lt / sc.dur);
      // появление рывком: масштаб 0.86 → 1 за 0.18 с, потом медленный наезд (Ken Burns)
      const k = ease(lt / 0.18);
      if (!full) { wrap.style.transform = `scale(${0.86 + 0.14 * k}) rotate(${(1 - k) * (v.rot ?? -2)}deg)`; wrap.style.opacity = k; }
      img.style.transform = `scale(${1.02 + zoom * p}) translate(${(v.pan ?? 0) * p}px, 0)`;
      if (joke) { const kj = ease((lt - 0.35) / 0.16); joke.style.opacity = kj; joke.style.transform = `scale(${0.8 + 0.2 * kj}) rotate(-3deg)`; }
      if (v.frames) return setSrc(img, frameSrc(v, Math.floor(lt * 30)));
    } };
  },

  // v3: секундомер - «за 5 секунд», «через час»: кольцо убывает, цифры тикают с толчком, подпись появляется к слову
  timer(v, box) {
    const w = el('div', 'timer'), C = 2 * Math.PI * 175;
    w.innerHTML = `<div class="dial"><div class="knob"></div><svg viewBox="0 0 420 420"><circle class="tr" cx="210" cy="210" r="175"/>
      <circle class="tf" cx="210" cy="210" r="175" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="td"></div></div>`;
    const dial = w.querySelector('.dial'), tf = w.querySelector('.tf'), td = w.querySelector('.td');
    const c = v.c ? el('div', 'tc', nb(v.c)) : null; if (c) w.appendChild(c);
    box.appendChild(w);
    const at = v.at ?? 0.25, tick = v.tick ?? 0.42;
    return { anim(lt) {
      const k = ease(lt / 0.25);
      dial.style.opacity = k; dial.style.transform = `scale(${0.7 + 0.3 * k})`;
      const x = Math.max(0, (lt - at) / tick), n = Math.max(0, v.from - Math.floor(x));
      td.textContent = fmtTime(n, v.fmt);
      td.style.color = n <= 1 ? '#ff3b30' : '';
      const ph = n > 0 ? x % 1 : 1; // толчок цифр на каждом тике
      td.style.transform = `scale(${1 + 0.1 * Math.pow(1 - Math.min(1, ph * 4), 2)})`;
      tf.setAttribute('stroke-dashoffset', String(C * Math.min(1, x / v.from)));
      if (c) { const k2 = ease((lt - (v.cAt ?? 1.2)) / 0.25); c.style.opacity = k2; c.style.transform = `translateY(${(1 - k2) * 30}px) scale(${0.85 + 0.15 * k2})`; }
    } };
  },

  // v3: строки по очереди, на каждой с ударом штамп ✕ или ✓ (ok: true) - вместо статичного списка
  checks(v, box) {
    const L = el('div', 'checks');
    const rows = v.items.map((it) => {
      const r = el('div', 'row', `<div class="tx">${nb(it.t)}</div>`);
      const ic = el('div', 'ic', it.ok ? SVG_OK : SVG_X); r.appendChild(ic); L.appendChild(r);
      return { r, ic, ok: !!it.ok };
    });
    box.appendChild(L);
    return { anim(lt) {
      rows.forEach(({ r, ic, ok }, i) => {
        const a = (v.at ?? 0.2) + i * (v.step ?? 0.32);
        const k = ease((lt - a) / 0.2), k2 = clamp((lt - a - 0.12) / 0.14);
        r.style.opacity = k; r.style.transform = `translateX(${(1 - k) * 80}px)`;
        ic.style.opacity = k2; ic.style.transform = `scale(${2.2 - 1.2 * ease(k2)}) rotate(${(1 - k2) * -25}deg)`;
        r.classList.toggle(ok ? 'good' : 'bad', k2 >= 1);
      });
    } };
  },

  // v3: путь по настройкам - экраны телефона сменяются, на нужной строке нажатие (палец-круг) и подсветка.
  // { type: 'path', screens: [{ t: 'Настройки', rows: [...], tap: 1 }, ...], at, step }
  path(v, box) {
    const p = el('div', 'phone'), wrap = el('div', 'path'); wrap.appendChild(p);
    p.innerHTML = '<div class="bar" style="z-index:3"></div>';
    const scr = v.screens.map((S) => {
      const d = el('div', 'scr', `<div class="st">${S.t}</div>`);
      const rows = S.rows.map((r) => { const x = el('div', 'pr', `<i></i><span>${nb(r)}</span>`); d.appendChild(x); return x; });
      const tap = el('div', 'tap'); d.appendChild(tap); p.appendChild(d);
      return { d, rows, tap, k: S.tap ?? 0 };
    });
    box.appendChild(wrap);
    const at = v.at ?? 0.3, step = v.step ?? 1.0;
    return { anim(lt) {
      const k0 = ease(lt / 0.3); p.style.opacity = k0; p.style.transform = `translateY(${(1 - k0) * 60}px)`;
      scr.forEach((S, i) => {
        const t0 = at + i * step, kin = i ? ease((lt - t0) / 0.28) : 1;
        S.d.style.transform = `translateX(${(1 - kin) * 100}%)`;
        S.d.style.display = i && lt < t0 ? 'none' : 'block';
        const tt = t0 + step * 0.55, d = lt - tt, row = S.rows[S.k];
        row.classList.toggle('on', d >= 0);
        const on = d >= 0 && d < 0.45;
        S.tap.style.display = on ? 'block' : 'none';
        if (on) {
          S.tap.style.left = `${row.offsetLeft + row.offsetWidth * 0.72}px`; S.tap.style.top = `${row.offsetTop + row.offsetHeight / 2}px`;
          S.tap.style.transform = `scale(${0.4 + 1.2 * ease(d / 0.45)})`; S.tap.style.opacity = 0.9 * (1 - d / 0.45);
        }
      });
    } };
  },

  cta(v, box, s) {
    // v3 с лицом: лицо крупно над кнопкой («Пиши НАВИГАТОР» в камеру), кнопка и темы ниже лица
    const face = window.VIDEO?.v3 && window.VIDEO?.lico;
    const btn = el('div', 'btn', `<span>${v.btn ?? 'Ссылка в профиле'}</span>`); btn.style.top = face ? '505px' : '180px';
    const tg = el('div', 'tg', nb(v.t ?? 'Telegram @bahramovartsiom')); tg.style.top = face ? '640px' : '350px';
    if (face) tg.style.fontSize = '38px';
    // темы, с которыми пишут, — загораются по очереди, чтобы финал не стоял на месте
    const ch = el('div', 'tg'); ch.style.top = face ? '745px' : '470px';
    const chips = (v.chips ?? ['Блокировка', 'Взлом', 'Восстановление']).map((c) => { const p = el('span', 'pill g', c); p.style.margin = '0 8px 16px'; ch.appendChild(p); return p; });
    box.append(btn, tg, ch);
    return { anim(lt) {
      const k = ease(lt / 0.35), k2 = ease((lt - 0.3) / 0.35);
      btn.style.opacity = k; btn.style.transform = `translateY(${(1 - k) * 40}px) scale(${1 + 0.03 * Math.sin(lt * 5) * (k >= 1 ? 1 : 0)})`;
      tg.style.opacity = k2;
      chips.forEach((p, i) => { const k3 = ease((lt - 0.7 - i * 0.45) / 0.3); p.style.opacity = k3; p.style.transform = `translateY(${(1 - k3) * 24}px)`; });
    } };
  },
};

const frameSrc = (v, i) => `${v.frames}/${String(Math.min(i, v.nframes - 1) + 1).padStart(4, '0')}.jpg`;
// смена src + ожидание декодирования: кадр не уйдёт в ролик, пока картинка не готова
function setSrc(img, src) {
  if (img.getAttribute('src') === src) return null;
  img.src = src;
  return img.decode().catch(() => {});
}

// Всплывающие вставки сцены: { src, at, dur, w, x, y, rot, cap } — скриншот или фото поверх кадра.
function buildPops(s) {
  s.popEls = (s.pop ?? []).map((p) => {
    const w = p.w ?? 860, x = p.x ?? (1080 - w) / 2, y = p.y ?? 640;
    const box = el('div', 'pop'); box.style.cssText += `left:${x}px;top:${y}px;width:${w}px`;
    const im = el('img'); im.src = p.src; box.appendChild(im); s.node.appendChild(box);
    let cap = null;
    if (p.cap) { cap = el('div', 'popcap', `<span>${p.cap}</span>`); cap.style.cssText += `left:${x + 24}px;top:${y - 30}px`; s.node.appendChild(cap); }
    let joke = null;
    if (p.joke) { joke = el('div', 'joke', `<span>${p.joke}</span>`); joke.style.top = `${p.jy ?? y - 120}px`; s.node.appendChild(joke); }
    return { p, box, cap, joke };
  });
}
function animPops(s, lt) {
  for (const { p, box, cap, joke } of s.popEls) {
    const at = p.at ?? 0.6, end = at + (p.dur ?? 2.2);
    const k = ease((lt - at) / 0.16), out = clamp((lt - end) / 0.15);
    const on = lt >= at && lt < end + 0.15;
    for (const e of [box, cap, joke]) if (e) e.style.display = on ? 'block' : 'none';
    if (!on) continue;
    // страховка: вставка не заходит на субтитры (полоса с 1280 px) — поднимаем целиком
    const top0 = p.y ?? 640, over = top0 + box.offsetHeight - 1270;
    box.style.top = `${over > 0 ? top0 - over : top0}px`;
    if (cap) cap.style.top = `${(over > 0 ? top0 - over : top0) - 30}px`;
    box.style.opacity = 1 - out;
    box.style.transform = `scale(${0.82 + 0.18 * k - 0.08 * out}) rotate(${(p.rot ?? 2) * (1 - k * 0.6)}deg)`;
    if (cap) { cap.style.opacity = k * (1 - out); }
    if (joke) { joke.style.opacity = ease((lt - at - 0.25) / 0.15) * (1 - out); joke.style.transform = `rotate(${p.jrot ?? -3}deg)`; }
  }
}

// v3: поверх сцены - штамп ✕/✓ ({ at, e: 'x'|'ok', x, y, size }) и плашка-таймер ({ at, from, tick, cap })
function buildMarks(s) {
  if (s.stamp) {
    const st = s.stamp, z = st.size ?? 220, m = el('div', 'stamp', st.e === 'ok' ? SVG_OK : SVG_X);
    m.style.cssText += `left:${st.x ?? 720}px;top:${st.y ?? 600}px;width:${z}px;height:${z}px`;
    s.node.appendChild(m); s.stampEl = m;
  }
  if (s.badge) {
    const b = el('div', 'badge', `<div class="dot"></div><div class="bd"></div>${s.badge.cap ? `<div class="bc">${nb(s.badge.cap)}</div>` : ''}`);
    s.node.appendChild(b); s.badgeEl = b;
  }
}
function animMarks(s, lt) {
  if (s.stampEl) {
    const d = lt - s.stamp.at, k = clamp(d / 0.16);
    s.stampEl.style.display = d >= 0 ? 'block' : 'none';
    // удар: из крупного в свой размер с поворотом, потом лёгкое покачивание
    s.stampEl.style.transform = `scale(${2.4 - 1.4 * ease(k)}) rotate(${-24 + 14 * ease(k) + (k >= 1 ? Math.sin((d - 0.16) * 9) * 2 * Math.exp(-(d - 0.16) * 3) : 0)}deg)`;
    s.stampEl.style.opacity = k;
  }
  if (s.badgeEl) {
    const b = s.badge, d = lt - b.at, k = ease(d / 0.18);
    s.badgeEl.style.display = d >= 0 ? 'flex' : 'none';
    const n = Math.max(0, b.from - Math.max(0, Math.floor(d / (b.tick ?? 0.25))));
    s.badgeEl.querySelector('.bd').textContent = fmtTime(n, 'hms');
    s.badgeEl.querySelector('.dot').style.opacity = Math.floor(d / 0.25) % 2 ? 0.25 : 1; // мигает, как запись
    s.badgeEl.style.transform = `scale(${0.6 + 0.4 * backOut(d / 0.25)}) translateX(${d < 0.35 ? Math.sin(d * 80) * 8 * (1 - d / 0.35) : 0}px)`;
    s.badgeEl.style.opacity = k;
  }
}

function build(V) {
  document.getElementById('label').textContent = V.label;
  document.getElementById('strip').innerHTML = V.strip;
  const root = document.getElementById('scenes');
  for (const s of V.scenes) {
    const node = el('div', 'scene'); s.node = node; root.appendChild(node);
    s.headNode = headEl(s.head, s.small); node.appendChild(s.headNode);
    const box = el('div', 'vis'); node.appendChild(box);
    s.v = s.vis ? VIS[s.vis.type](s.vis, box, s) : null;
    buildPops(s);
    buildMarks(s);
    // Субтитры: куски по предложениям и запятым, время пропорционально длине.
    const parts = (s.sub ?? s.say).replace(/\+/g, "").match(/[^.?!,:;]+[.?!,:;]?/g).map((x) => x.trim().replace(/[,:;]$/, '')).filter(Boolean);
    const total = parts.reduce((a, p) => a + p.length, 0);
    let acc = 0;
    s.subs = parts.map((p) => { const st = acc / total * s.voiceDur; acc += p.length; return { text: p, start: st, end: acc / total * s.voiceDur }; });
  }
}

// Длинное слово (ЗАПРАШИВАЙТЕ) не должно вылезать за поля: уменьшаем кегль заголовка, пока самое
// широкое слово не влезет. Мерим после загрузки шрифтов, один раз на сцену.
function fitHead(s) {
  if (s.fitted || document.fonts.status !== 'loaded') return;
  const h = s.headNode, max = h.clientWidth;
  let fs = parseFloat(getComputedStyle(h).fontSize);
  const widest = () => Math.max(...[...h.children].map((w) => w.scrollWidth + 18));
  while (widest() > max && fs > 40) { fs -= 2; h.style.fontSize = fs + 'px'; }
  s.fitted = true;
}

function animHead(s, lt) {
  fitHead(s);
  if (window.VIDEO.v3 && s === window.VIDEO.scenes[0]) lt += 1; // v3: заголовок хука виден с кадра 0
  [...s.headNode.children].forEach((w, i) => {
    const k = ease((lt - i * 0.06) / 0.25);
    w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 40}px)`;
  });
}

// Слово под голос: времена слов из Whisper (render.mjs → s.words), иначе пропорционально длине.
function wordAt(s, lt) {
  const W = s.words; if (!W?.length) return null;
  let w = null; for (const x of W) { if (lt >= x.s - 0.04) w = x; else break; }
  if (!w || lt > s.voiceDur + 0.05) return null;
  return w.w;
}

function wordIdx(s, lt) {
  const W = s.words; if (!W?.length || lt > s.voiceDur + 0.05) return -1;
  let k = -1; for (let i = 0; i < W.length; i++) { if (lt >= W[i].s - 0.04) k = i; else break; }
  return k;
}

// v3: камера (переход в сцену, наезд на акценте, тряска), вспышка, эмодзи, полоска прогресса, петля
function camV3(V, cur, lt, t) {
  const i = V.scenes.indexOf(cur), cam = document.getElementById('cam');
  let sc = 1, tx = 0, ty = 0, rot = 0, blur = 0, fl = 0;
  if (i > 0 && lt < 0.26) {
    const k = ease(lt / 0.24);
    if (cur.trans === 'zoom') { sc *= 1.16 - 0.16 * k; blur = 14 * (1 - k); }        // наезд с размытием
    else if (cur.trans === 'slide') { tx = 200 * (1 - k); blur = 9 * (1 - k); }      // сдвиг
    else if (cur.trans === 'flash') { fl = 0.75 * (1 - clamp(lt / 0.18)); sc *= 1.06 - 0.06 * k; } // вспышка
  }
  // резкий наезд на акцентном слове: за 0,07 с до +7 %, дальше держится на половине до конца сцены
  for (const p of cur.fx?.punch ?? []) { const d = lt - p; if (d >= 0) sc *= 1 + 0.07 * (d < 0.07 ? ease(d / 0.07) : 0.5 + 0.5 * Math.exp(-(d - 0.07) * 6)); }
  // лёгкая тряска на «мошенник», «взлом», «удалят»...
  for (const p of cur.fx?.shake ?? []) { const d = lt - p; if (d >= 0 && d < 0.4) { const a = 1 - d / 0.4; tx += Math.sin(d * 97) * 12 * a; ty += Math.cos(d * 73) * 9 * a; rot += Math.sin(d * 59) * 0.8 * a; } }
  cam.style.transform = `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${sc.toFixed(4)}) rotate(${rot.toFixed(2)}deg)`;
  cam.style.filter = blur > 0.3 ? `blur(${blur.toFixed(1)}px)` : 'none';
  const flash = document.getElementById('flash'); flash.style.display = fl > 0.01 ? 'block' : 'none'; flash.style.opacity = fl;
  // полоска прогресса; петля: последние V.loop с ролик плавно становится своим кадром 0
  const lk = V.loop ? ease((t - (V.total - V.loop)) / V.loop) : 0;
  const prog = document.getElementById('prog');
  // в петле полоска «отматывается» к нулю - последний кадр совпадает с кадром 0
  prog.firstChild.style.width = `${(Math.min(100, t / V.total * 100) * (1 - lk)).toFixed(2)}%`;
  const lh = document.getElementById('loophead');
  for (const s of V.scenes) s.node.style.opacity = s === cur && lk > 0 ? 1 - lk : '';
  lh.style.display = lk > 0 ? 'block' : 'none'; lh.style.opacity = lk;
  if (lk > 0) lh.firstChild.style.fontSize = V.scenes[0].headNode.style.fontSize; // кегль как у заголовка в кадре 0
  if (lk > 0) {
    const fill = document.getElementById('bgfill'); fill.style.opacity = (parseFloat(fill.style.opacity) || 0) * (1 - lk);
    document.getElementById('strip').style.opacity = lk;
  }
}

let lastBg = null;
window.seek = (t) => {
  const V = window.VIDEO;
  let cur = V.scenes[V.scenes.length - 1];
  for (const s of V.scenes) if (t >= s.start && t < s.start + s.dur) { cur = s; break; }
  for (const s of V.scenes) s.node.style.display = s === cur ? 'block' : 'none';
  const lt = t - cur.start;
  // размытый фон: картинка текущей сцены, у схем — последняя показанная, чтобы кадр жил
  const fill = document.getElementById('bgfill');
  const bg = cur.bg ?? lastBg;
  if (cur.bg) lastBg = cur.bg;
  if (bg && fill.dataset.src !== bg) { fill.style.backgroundImage = `url("${bg}")`; fill.dataset.src = bg; }
  fill.style.opacity = bg && !cur.vis?.full ? (cur.bg ? 1 : 0.55) : 0;
  animHead(cur, lt);
  const wait = cur.v ? cur.v.anim(lt, cur) : null;
  animPops(cur, lt);
  animMarks(cur, lt);
  const isCta = cur.vis?.type === 'cta';
  const subEl = document.getElementById('sub');
  if (V.wordSubs) {
    subEl.className = 'sub word';
    if (V.v3) {
      // v3: ключевые слова (из заголовка, цифры, «мошенник») - оранжевые и крупнее; каждое слово выскакивает
      const k = isCta ? -1 : wordIdx(cur, lt), w = k >= 0 ? cur.words[k].w : null, hl = k >= 0 && (cur.fx?.hl ?? []).includes(k);
      // эмодзи-оценка - в строке субтитра после слова (над субтитром он налезал на телефон и списки)
      const em = (cur.fx?.emoji ?? []).find((e) => lt >= e.at && lt < e.at + 1.0), d = em ? lt - em.at : 0;
      const emo = em && w ? `<span class="emo" style="opacity:${d > 0.8 ? (1 - (d - 0.8) / 0.2).toFixed(2) : 1};transform:scale(${backOut(d / 0.22).toFixed(3)}) rotate(${(-14 + 10 * ease(d / 0.3)).toFixed(1)}deg)">${em.e}</span>` : '';
      subEl.innerHTML = w ? `<span class="ln"><span class="${hl ? 'hl' : ''}">${w}</span>${emo}</span>` : '';
      let fs = hl ? 92 : 78; subEl.style.fontSize = fs + 'px';
      const sp = subEl.firstChild;
      while (sp && sp.offsetWidth > subEl.clientWidth - 8 && fs > 40) { fs -= 3; subEl.style.fontSize = fs + 'px'; }
      subEl.style.transform = w ? `scale(${(1 + (hl ? 0.2 : 0.08) * (1 - ease((lt - cur.words[k].s) / 0.14))).toFixed(3)})` : '';
    } else {
    const w = isCta ? null : wordAt(cur, lt);
    subEl.innerHTML = w ? (/\d/.test(w) ? `<span class="hl">${w}</span>` : w) : '';
    subEl.style.fontSize = V.lico && w && w.length > 12 ? `${Math.round(78 * 12 / w.length)}px` : ''; // длинное слово ужимаем в 600px
    }
  } else {
    const sub = cur.subs.find((x) => lt >= x.start && lt < x.end) || (lt >= cur.voiceDur ? cur.subs[cur.subs.length - 1] : null);
    subEl.textContent = sub && !isCta ? sub.text : '';
  }
  document.getElementById('strip').style.opacity = isCta ? 0 : 1;
  if (V.v3) camV3(V, cur, lt, t);
  return wait;
};

window.init = (V) => {
  window.VIDEO = V; document.body.classList.toggle('lico', !!V.lico);
  if (V.v3) {
    const cam = el('div'); cam.id = 'cam';
    document.body.insertBefore(cam, document.body.firstChild);
    cam.append(document.getElementById('bgfill'), document.getElementById('scenes'));
    document.getElementById('prog').style.display = 'block';
  }
  build(V);
  if (V.v3 && V.loop) { const s0 = V.scenes[0]; document.getElementById('loophead').appendChild(headEl(s0.head, s0.small)); }
  return seek(0);
};
</script>
</body>
